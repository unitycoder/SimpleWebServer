# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

# dummy fix for 403 error?
permissions:
  contents: write

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Publish
      run: dotnet publish SimpleWebServer.csproj -c Release -o bin/Release/net9.0 /p:PublishSingleFile=true /p:DebugType=none --self-contained
    - name: Create Release Archive
      run: |
        # Create a zip archive of the release files using PowerShell
        Compress-Archive -Path ./bin/Release/net9.0/SimpleWebServer.exe -DestinationPath SimpleWebServer.zip
      working-directory: ${{ github.workspace }}
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimpleWebServer
        path: SimpleWebServer.zip
        if-no-files-found: error
    - name: Generate release tag
      id: tag
      run: |
        echo "release_tag=SimpleWebServer_$(Get-Date -Format 'dd_MM_yyyy_HH-mm')" >> $env:GITHUB_OUTPUT
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: SimpleWebServer.zip
        
